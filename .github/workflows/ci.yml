name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Run unit API and behavior tests
        run: pytest -q
      - name: Validate eval JSON
        run: python -m json.tool evals/cases.json >/dev/null
      - name: Check whitespace
        run: git diff --check
